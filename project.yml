name: QueenBee
options:
  bundleIdPrefix: dev.queenbee
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  QueenBeeCore:
    path: Core
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.99.0
  swift-subprocess:
    url: https://github.com/swiftlang/swift-subprocess.git
    from: 1.0.0
targets:
  QueenBee:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Plugin/qb-link
        type: folder
        buildPhase: resources
    dependencies:
      - package: QueenBeeCore
      - package: SwiftTerm
      - package: swift-subprocess
        product: Subprocess
      - target: qb
        embed: false
        link: false
    postBuildScripts:
      - name: Embed qb helper
        script: |
          cp -f "${BUILT_PRODUCTS_DIR}/qb" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/qb"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/qb
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/qb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.queenbee.app
        PRODUCT_NAME: QueenBee
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Queen Bee
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_APP_SANDBOX: NO
  qb:
    type: tool
    platform: macOS
    sources:
      - path: Helper
    dependencies:
      - package: QueenBeeCore
    settings:
      base:
        PRODUCT_NAME: qb
        SKIP_INSTALL: YES
schemes:
  QueenBee:
    build:
      targets:
        QueenBee: all
    run:
      config: Debug
